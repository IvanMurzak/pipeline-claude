name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── The plugin's own tests (plugin-thin `p5`, narrowed by `p6`, final in `p9`)
  # `tests/` at the REPOSITORY ROOT covers what is genuinely THIS repository's.
  # There is nothing else left to cover: this repository is now skills, agents,
  # `hooks.json` and `run-hook.sh` — no code.
  #
  # THE `Pipeline CLI` JOB WAS REMOVED HERE, with the `apps/pipeline-cli`
  # directory it ran in (`p9`). It is not "missing"; the app it tested is in
  # `IvanMurzak/pipeline` now, where that repository's own CI runs the same
  # suites on the same two-OS matrix. A job kept pointing at a deleted
  # directory does not fail loudly — `bun test tests/` in a `working-directory`
  # that no longer exists is a setup error at best and a vacuous pass at worst,
  # which is the failure this comment exists to prevent anyone re-creating.
  #
  # The history, because it explains the shape: `p5` put thirteen hook suites
  # here, beside the `hooks/*.ts` relays they covered. `p6` turned those relays
  # into `pipeline hook <name>` subcommands in `IvanMurzak/pipeline`, and twelve
  # of the thirteen went with them — a test lives in the tree that contains what
  # it tests. They run there, because A RELOCATED TEST NO JOB RUNS IS A DELETED
  # TEST.
  #
  # What remains here is what `p6` deliberately did NOT move:
  #   • hook-run-shim.test.ts — `hooks/run-hook.sh` (which survives, resolving
  #     `pipeline` instead of `bun`) and the `hooks.json` wiring that routes
  #     through it, including the committed 100755 mode. Both files are this
  #     plugin's; moving their test to the CLI would have left it testing
  #     nothing.
  #   • cli-package-self-contained.test.ts — REMOVED in `p9`. It guarded that
  #     `apps/pipeline-cli` reached nothing above itself, which is what made
  #     deleting that directory safe; it went away with the directory, exactly
  #     as its own header and its first assertion instructed.
  #
  # NO ROOT `package.json`, DELIBERATELY. Claude Code installs a plugin by
  # cloning this repository — there is no install step, ever. A root manifest
  # would imply one, would put a second `name`/`version` beside
  # `.claude-plugin/plugin.json`, and would risk the marketplace loader for a
  # test runner that does not need it: `bun test` needs no manifest and no
  # install to run the directory it is started in. That is what this job does.
  #
  # Both operating systems, because the file that remains is the one most
  # exposed to the difference: `run-hook.sh` is POSIX sh, and its
  # resolution-chain block self-skips where `sh` is unavailable while the
  # `hooks.json` wiring assertions still run. Windows is where that skip — and
  # the `pipeline` lookup the shim performs — actually gets exercised.
  plugin-hooks:
    name: Plugin hooks + shim (tests/)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # ⚠ `working-directory`, NOT `bun test tests/`. A positional argument to
    # `bun test` is a FILE-NAME FILTER, not a directory scope — `bun test
    # --help` says so ("Run all test files with 'foo' or 'bar' in the file
    # name"). `bun test tests/` from the root therefore matched every path
    # CONTAINING `tests/`: when the CLI still lived here that was its whole
    # suite plus the templates', and the first run of this job executed 2427
    # tests across 119 files, duplicating an entire other job. The CLI is gone
    # (`p9`) so there is less to collide with today, but the form is still
    # wrong and stays fixed — bun scans from its working directory, so scoping
    # it means putting it there, not passing a path.
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # No install step and no manifest — see the note above.
      - name: Run plugin tests
        run: bun test

  manifest-validation:
    name: Plugin manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate plugin manifest, hooks, agents, skills
        run: python .github/scripts/validate-manifest.py

# Cuts a release of the Claude Code plugin from this repo: verify and tag.
#
# MANUAL ONLY. It does not fire on a pushed tag or a published GitHub Release —
# this workflow CREATES the release rather than reacting to one, so a release
# cannot exist that these checks never passed. Previously a human made the
# Release by hand and the workflow ran afterwards: the tag was already public
# while the suite was still running, and a red run left a released version
# nobody could unrelease.
#
# ONE ARTIFACT NOW — the plugin (`.claude-plugin/plugin.json`), tagged `v*`.
#
# THE `cli` TARGET WAS REMOVED IN plugin-thin `p9`, together with the
# `apps/pipeline-cli` directory it built from. The npm package
# `@baizor/pipeline` is released from its own repository, `IvanMurzak/pipeline`,
# by that repo's `.github/workflows/release.yml` — which has its own npm Trusted
# Publisher registration. This workflow no longer publishes anything to npm; it
# verifies and tags, and nothing else.
#
# ⚠ THE TAG DOES NOT DELIVER THE PLUGIN — MERGING TO `main` DOES. The
# marketplace (`IvanMurzak/pipeline-claude-marketplace`) resolves this plugin by
# `url` + `ref: main` — no submodule, no pointer, no version pin — so whatever
# `main` holds is what users install, and a bumped `.claude-plugin/plugin.json`
# reaches them by itself as soon as it lands there (Claude Code caches by
# `name@version`). What this workflow produces is versioning and release notes.
# Running it is therefore never the step that ships a fix, and skipping it never
# withholds one.
#
# Separately, the parent monorepo (`IvanMurzak/ai-pipeline`) DOES pin this repo
# as a submodule and DOES need a pointer bump. That is a development concern and
# is NOT on the distribution path — do not conflate the two. `CLAUDE.md`
# ("bump `version` in `plugin.json`") states the same rules from the authoring
# side; keep the two in agreement.
#
# Consequently there is NO `target` input any more. It existed only to tell the
# two artifacts apart, and inferring nothing is better than offering a choice
# with one option. Nothing invoked this workflow programmatically (it is
# operator-driven `workflow_dispatch`), so removing the input breaks no caller.
#
# ⚠ OWNER FOLLOW-UP, OUTSIDE THIS REPO. npm still carries a Trusted Publisher
# entry for `@baizor/pipeline` pointing at this repository + this workflow file.
# It is now unused and over-broad — it authorizes THIS repo to publish that
# package, which only `IvanMurzak/pipeline` should do. Removing it is a manual
# change on npmjs.com (package Settings -> Trusted Publishers) that CI cannot
# make. `id-token: write` is dropped below because nothing here publishes.
#
# ⚠ THE FILENAME IS LEFT ALONE ON PURPOSE. `release-cli.yml` no longer
# describes what this file does, and renaming it is now SAFE from npm's point of
# view (this workflow performs no publish, so no OIDC claim depends on its
# path). It is still not renamed here: `p9` is an irreversible delete of 229
# files and a rename is unrelated churn in the same change. Rename it in a
# standalone commit if it bothers you — and delete the stale npm Trusted
# Publisher entry above first, so the two never disagree. The `name:` below is
# free to be accurate: npm does not read it.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version to release. Must match .claude-plugin/plugin.json exactly — a mismatch fails the run."
        required: true
      dry_run:
        description: "Rehearse: run every check, tag NOTHING."
        type: boolean
        default: false

permissions:
  contents: write # create the git tag + GitHub Release

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  # ── Gate ────────────────────────────────────────────────────────────────────
  # Everything that can say NO lives here, and it releases nothing.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need tags + history

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Commit is on main
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not an ancestor of origin/main"; exit 1; }

      # The input is intent; the manifest is fact. Disagreement means the
      # operator believes they are shipping something they are not.
      - name: Version matches the plugin manifest
        id: version
        run: |
          IN="${{ inputs.version }}"; IN="${IN#v}"
          ACTUAL="$(node -p "require('./.claude-plugin/plugin.json').version")"
          if [ "$ACTUAL" != "$IN" ]; then
            echo "::error::input version '$IN' != .claude-plugin/plugin.json '$ACTUAL'"; exit 1
          fi
          echo "value=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "tag=v${ACTUAL}" >> "$GITHUB_OUTPUT"
          echo "releasing plugin $ACTUAL as v${ACTUAL}"

      - name: Tag does not exist
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists"; exit 1
          fi

      # The plugin manifest is what Claude Code caches by name@version. A
      # malformed one installs as nothing, and the failure surfaces at a user's
      # machine rather than here.
      - name: Plugin manifest parses
        run: node -e 'const m=require("./.claude-plugin/plugin.json"); if(!m.name||!m.version) throw new Error("plugin.json missing name/version"); console.log(m.name+"@"+m.version)'

      # The plugin's own suite — `hooks/run-hook.sh` and the `hooks.json` wiring
      # that routes through it. This is what "the plugin works" means now that
      # the repository ships no code: see `.github/workflows/ci.yml` for why the
      # `working-directory` form is the correct one.
      - name: Plugin hooks + shim tests
        working-directory: tests
        run: bun test

      - name: Validate plugin manifest, hooks, agents, skills
        run: python .github/scripts/validate-manifest.py

  # ── Release ─────────────────────────────────────────────────────────────────
  release:
    name: Tag
    needs: verify
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"
